name: CI Dev Pipeline

on:
  push:
    branches:
      - dev
      - prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t intranet-newdeal .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intranet-newdeal

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag image
        run: docker tag intranet-newdeal ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:latest
